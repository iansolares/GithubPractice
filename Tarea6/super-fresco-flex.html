<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Súper Fresco</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="sitio-header">
      <div class="marca">Súper Fresco</div>
      <nav class="nav-principal">
        <ul>
          <li><a href="#ofertas">Ofertas</a></li>
          <li><a href="#categorias">Categorías</a></li>
          <li><a href="#combos">Combos</a></li>
          <li><a href="#carrito">Carrito</a></li>
        </ul>
      </nav>
    </header>

    <section class="hero">
      <h1>Frescura todos los días</h1>
      <p>Encuentra las mejores ofertas de la semana, cerca de ti.</p>
    </section>

    <section class="catalogo">
      <h2>Ofertas de la semana</h2>
      <div class="productos">
        <article class="producto">
          <img
            src="https://placehold.co/300x200/c8e6c9/1b5e20?text=Manzanas"
            alt="Manzanas"
          />
          <h3>Manzanas</h3>
          <p class="precio">$10.00</p>
          <button class="agregar">Agregar</button>
        </article>

        <article class="producto">
          <img
            src="https://placehold.co/300x200/fff3e0/ef6c00?text=Leche"
            alt="Leche"
          />
          <h3>Leche</h3>
          <p class="precio">$18.00</p>
          <button class="agregar">Agregar</button>
        </article>

        <article class="producto">
          <img
            src="https://placehold.co/300x200/ffe0b2/e65100?text=Pan"
            alt="Pan artesanal"
          />
          <h3>Pan artesanal</h3>
          <p class="precio">$25.00</p>
          <button class="agregar">Agregar</button>
        </article>

        <article class="producto">
          <img
            src="https://placehold.co/300x200/ffccbc/bf360c?text=Zanahorias"
            alt="Zanahorias"
          />
          <h3>Zanahorias</h3>
          <p class="precio">$8.00</p>
          <button class="agregar">Agregar</button>
        </article>
      </div>
    </section>
  </body>
</html>
